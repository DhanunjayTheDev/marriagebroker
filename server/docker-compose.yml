version: '3.9'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: avyuktha-api
    restart: unless-stopped
    ports:
      - '${PORT:-5000}:5000'
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - MONGODB_URI=${MONGODB_URI}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    networks:
      - avyuktha-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: avyuktha-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - avyuktha-network

  bull-board:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: avyuktha-bull-board
    restart: unless-stopped
    ports:
      - '5001:5001'
    env_file:
      - .env
    environment:
      - BULL_BOARD_PORT=5001
    depends_on:
      - redis
    networks:
      - avyuktha-network

  nginx:
    image: nginx:alpine
    container_name: avyuktha-nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - api
    networks:
      - avyuktha-network

networks:
  avyuktha-network:
    driver: bridge

volumes:
  redis-data:
    driver: local
